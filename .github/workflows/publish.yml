name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version bump
        type: choice
        required: true
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease

      tag:
        description: npm dist-tag
        type: choice
        required: true
        default: latest
        options:
          - latest
          - beta
          - alpha
          - rc
          - next

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          VERSION="${{ inputs.version }}"
          TAG="${{ inputs.tag }}"

          if [[ "$VERSION" == pre* ]]; then
            if [[ "$TAG" == "latest" ]]; then
              TAG="beta"
            fi

            npm version "$VERSION" \
              --preid="$TAG" \
              --no-git-tag-version
          else
            npm version "$VERSION" \
              --no-git-tag-version
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Sync JSR version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node -e "
            const fs = require('node:fs');
            const jsr = JSON.parse(fs.readFileSync('jsr.json', 'utf8'));
            jsr.version = '$VERSION';
            fs.writeFileSync('jsr.json', JSON.stringify(jsr, null, 2) + '\n');
          "

      - name: Format
        run: npx -y -p prettier -p @tenedev/prettier-config -- sh -c '
          NODE_MODULES="$(dirname "$(dirname "$(command -v prettier)")")"
          CONFIG="$(NODE_PATH="$NODE_MODULES" node -p "require.resolve(\"@tenedev/prettier-config\")")"
          prettier --write . --config "$CONFIG"
          '

      - name: Read version
        id: version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        run: |
          git add .
          git commit -m "chore(release): v${{ steps.version.outputs.version }}"

      - name: Create tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"

      - name: Push changes
        run: |
          git push --atomic origin \
            "HEAD:refs/heads/${{ github.ref_name }}" \
            "refs/tags/v${{ steps.version.outputs.version }}"

  publish-jsr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: jsr
      url: https://jsr.io/@pegora/tsconfig
    needs: prepare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Publish
        run: npx jsr publish

  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/@pegora/tsconfig
    needs: prepare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Publish
        run: npm publish --provenance --tag "${{ needs.prepare.outputs.tag }}"

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    needs:
      - prepare
      - publish-jsr
      - publish-npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.prepare.outputs.version }}
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ inputs.version }}"
          RELEASE_TAG="v${{ needs.prepare.outputs.version }}"
          RELEASE_COMMIT="HEAD^"
          REPO_URL="https://github.com/${{ github.repository }}"

          if [[ "$VERSION" == pre* ]]; then
            PREV_TAG=$(git describe --tags --abbrev=0 "$RELEASE_COMMIT" 2>/dev/null || true)
          else
            PREV_TAG=$(
              git tag --merged "$RELEASE_COMMIT" --sort=-version:refname \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | head -n 1 \
                || true
            )
          fi

          {
            echo "body<<EOF"
            echo "## Changes"
            echo

            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..${RELEASE_COMMIT}" --no-merges --pretty=format:"- %s ([%h](${REPO_URL}/commit/%H))"
            else
              git log "$RELEASE_COMMIT" --no-merges --pretty=format:"- %s ([%h](${REPO_URL}/commit/%H))"
            fi

            echo
            echo
            
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog:** ${REPO_URL}/compare/${PREV_TAG}...${RELEASE_TAG}"
            else
              echo "**Full Changelog:** ${REPO_URL}/commits/${RELEASE_TAG}"
            fi
            
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ startsWith(inputs.version, 'pre') }}

      - name: Create Release Discussion
        uses: abirismyname/create-discussion@v2.1.0
        with:
          title: "🚀 @pegora/tsconfig v${{ needs.prepare.outputs.version }} is now available!"
          body: ${{ steps.notes.outputs.body }}
          category-name: Announcements
